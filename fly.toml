# Set `app` to the name you claimed with `flyctl apps create`.
# It becomes your public address, so make it unguessable.
app = "claude-yahoo-bridge"

# Ashburn, Virginia -- the closest region to Roanoke.
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  # Anthropic's published egress range. Override with:
  #   flyctl secrets set ALLOW_CIDRS="160.79.104.0/21,THE.NEW.IP/32"
  ALLOW_CIDRS = "160.79.104.0/21"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Kept always-on: a cold start inside a connector call reads as a timeout.
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
